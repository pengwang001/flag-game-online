<!DOCTYPE html>
<html><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>🌍 Flag Game — Host</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui;background:#1a1a2e;color:#eee;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:20px}
h1{font-size:2em;margin-bottom:10px}
.screen{display:none;width:100%;max-width:800px;text-align:center}
.screen.active{display:block}
.join-url{background:#16213e;padding:15px 25px;border-radius:12px;font-size:1.3em;margin:15px 0;word-break:break-all}
.join-url a{color:#3b82f6;text-decoration:none}
.players{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:15px 0}
.player-badge{padding:8px 16px;border-radius:20px;font-weight:bold;font-size:1.1em}
.continents{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin:15px 0}
.cont-btn{padding:15px;border:none;border-radius:10px;background:#16213e;color:#eee;font-size:1.1em;cursor:pointer;transition:.2s}
.cont-btn:hover{background:#1a3a5c}
.cont-btn.selected{background:#3b82f6}
.start-btn{padding:12px 40px;border:none;border-radius:10px;background:#22c55e;color:#fff;font-size:1.2em;cursor:pointer;margin-top:10px}
.start-btn:disabled{opacity:.4;cursor:default}
.flag{font-size:6em;margin:10px 0}
.landmark{max-width:350px;max-height:200px;border-radius:12px;margin:10px auto;display:block}
.clues{text-align:left;max-width:500px;margin:10px auto}
.clue{padding:8px 12px;margin:4px 0;background:#16213e;border-radius:8px;animation:fadeIn .4s}
@keyframes fadeIn{from{opacity:0;transform:translateY(-5px)}to{opacity:1;transform:none}}
.options{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:500px;margin:15px auto}
.opt{padding:12px;border:2px solid #333;border-radius:10px;background:#16213e;color:#eee;font-size:1em;cursor:default}
.opt.correct{border-color:#22c55e;background:#16332e}
.opt.wrong{border-color:#ef4444;background:#331616}
.scoreboard{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:10px 0}
.score-card{padding:8px 16px;border-radius:10px;font-weight:bold}
.points-hint{color:#f59e0b;font-size:1.2em;margin:5px 0}
.next-btn{padding:10px 30px;border:none;border-radius:8px;background:#3b82f6;color:#fff;font-size:1.1em;cursor:pointer;margin-top:15px}
.result-list{list-style:none;max-width:400px;margin:15px auto}
.result-list li{padding:12px;margin:6px 0;border-radius:10px;font-size:1.2em;display:flex;justify-content:space-between}
.status{font-size:.9em;color:#888;margin:5px 0}
.answered-bar{height:6px;background:#333;border-radius:3px;max-width:300px;margin:8px auto}
.answered-fill{height:100%;background:#3b82f6;border-radius:3px;transition:width .3s}
</style>
</head><body>
<h1>🌍 Guess the Country!</h1>

<div id="lobby" class="screen active">
  <div class="join-url">Players join at: <a id="joinLink" href="#" target="_blank"></a></div>
  <img id="qrCode" style="margin:10px auto;display:block;border-radius:12px" width="200" height="200">
  <p class="status">Waiting for players...</p>
  <div id="lobbyPlayers" class="players"></div>
  <h3 style="margin-top:20px">Pick a continent:</h3>
  <div id="continents" class="continents"></div>
  <label style="margin-top:10px;display:block"><input type="checkbox" id="showFlags" checked> Show flags</label>
  <button id="startBtn" class="start-btn" disabled>Start Game</button>
</div>

<div id="game" class="screen">
  <div class="status" id="roundInfo"></div>
  <div id="scoreboard" class="scoreboard"></div>
  <div class="points-hint" id="pointsHint"></div>
  <div id="flagArea" class="flag"></div>
  <img id="landmark" class="landmark" style="display:none">
  <div id="clueList" class="clues"></div>
  <div class="answered-bar"><div id="answeredFill" class="answered-fill" style="width:0%"></div></div>
  <p class="status" id="answerStatus"></p>
  <div id="optionsArea" class="options" style="display:none"></div>
  <button id="nextBtn" class="next-btn" style="display:none">Next →</button>
</div>

<div id="results" class="screen">
  <h2>🏆 Final Scores</h2>
  <ol id="resultList" class="result-list"></ol>
  <button class="next-btn" onclick="ws.send(JSON.stringify({type:'back_to_lobby'}))">Play Again</button>
</div>

<script>
const proto = location.protocol === 'https:' ? 'wss' : 'ws';
let ws;
let selectedContinent = null;

function connectWs() {
  ws = new WebSocket(`${proto}://${location.host}`);
  ws.onopen = () => ws.send(JSON.stringify({type:'host'}));
  ws.onclose = () => setTimeout(connectWs, 1500);
  ws.onmessage = handleMsg;
}
connectWs();

const audioCtx = new (window.AudioContext||window.webkitAudioContext)();
function playTone(freq,dur,type='sine',vol=0.3){
  const o=audioCtx.createOscillator(),g=audioCtx.createGain();
  o.type=type;o.frequency.value=freq;g.gain.value=vol;
  o.connect(g);g.connect(audioCtx.destination);
  o.start();g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+dur);
  o.stop(audioCtx.currentTime+dur);
}
function sfxCorrect(){playTone(523,.1);setTimeout(()=>playTone(659,.1),100);setTimeout(()=>playTone(784,.2),200)}
function sfxWrong(){playTone(200,.15,'square',0.2);setTimeout(()=>playTone(150,.3,'square',0.2),150)}
function sfxNewRound(){playTone(440,.08,'sine',0.15)}
function sfxClue(){playTone(800,.05,'sine',0.15)}
function sfxAllAnswered(){playTone(600,.1);setTimeout(()=>playTone(800,.15),120)}
function sfxGameOver(){playTone(523,.1);setTimeout(()=>playTone(659,.1),120);setTimeout(()=>playTone(784,.1),240);setTimeout(()=>playTone(1047,.3),360)}

const $ = id => document.getElementById(id);
const joinUrl = `${location.origin}/play`;
$('joinLink').href = joinUrl;
$('joinLink').textContent = joinUrl;
fetch('/qr').then(r=>r.json()).then(d=>{$('qrCode').src=d.qr;}).catch(()=>{});

function handleMsg(e) {
  const m = JSON.parse(e.data);

  if (m.type === 'lobby') {
    show('lobby');
    $('lobbyPlayers').innerHTML = m.players.map(p =>
      `<div class="player-badge" style="background:${p.color}">${p.name}</div>`
    ).join('') || '<p style="color:#666">No players yet</p>';
    if (m.continents) {
      $('continents').innerHTML = m.continents.map(c =>
        `<button class="cont-btn${selectedContinent===c.name?' selected':''}" onclick="pickContinent('${c.name}')">${c.name} (${c.count})</button>`
      ).join('');
    }
    $('startBtn').disabled = !m.players.length || !selectedContinent;
  }

  if (m.type === 'question') {
    show('game');
    if(audioCtx.state==='suspended')audioCtx.resume();
    sfxNewRound();
    $('roundInfo').textContent = `Round ${m.round}/${m.total}`;
    $('flagArea').textContent = m.flag;
    if (m.img) { $('landmark').src = m.img; $('landmark').style.display = 'block'; }
    else { $('landmark').style.display = 'none'; }
    $('clueList').innerHTML = `<div class="clue">💡 ${m.clues[0]}</div>`;
    $('pointsHint').textContent = `⚡ ${m.points} pts`;
    $('scoreboard').innerHTML = m.players.map(p =>
      `<div class="score-card" style="background:${p.color}">${p.name}: ${p.score}</div>`
    ).join('');
    $('optionsArea').style.display = 'none';
    $('optionsArea').innerHTML = m.options.map(o => `<div class="opt">${o}</div>`).join('');
    $('nextBtn').style.display = 'none';
    $('answeredFill').style.width = '0%';
    $('answerStatus').textContent = 'Waiting for answers...';
  }

  if (m.type === 'clue') {
    sfxClue();
    $('clueList').innerHTML += `<div class="clue">💡 ${m.clue}</div>`;
    $('pointsHint').textContent = `⚡ ${m.points} pts`;
  }

  if (m.type === 'player_answered') {
    m.correct ? sfxCorrect() : sfxWrong();
    $('answeredFill').style.width = `${(m.answeredCount/m.totalPlayers)*100}%`;
    $('answerStatus').textContent = `${m.answeredCount}/${m.totalPlayers} answered`;
    $('scoreboard').innerHTML = m.players.map(p =>
      `<div class="score-card" style="background:${p.color}">${p.name}: ${p.score}</div>`
    ).join('');
  }

  if (m.type === 'all_answered') {
    sfxAllAnswered();
    $('answerStatus').textContent = `Answer: ${m.correctAnswer}`;
    $('optionsArea').style.display = 'grid';
    document.querySelectorAll('.opt').forEach(el => {
      if (el.textContent === m.correctAnswer) el.classList.add('correct');
      else el.classList.add('wrong');
    });
    $('scoreboard').innerHTML = m.players.map(p =>
      `<div class="score-card" style="background:${p.color}">${p.name}: ${p.score}</div>`
    ).join('');
    // Countdown to auto-advance
    let sec = m.autoAdvance || 3;
    $('nextBtn').style.display = 'inline-block';
    $('nextBtn').textContent = `Next (${sec}s)`;
    const cd = setInterval(() => { sec--; if(sec>0) $('nextBtn').textContent=`Next (${sec}s)`; else clearInterval(cd); }, 1000);
  }

  if (m.type === 'gameover') {
    show('results');
    sfxGameOver();
    const medals = ['🥇','🥈','🥉'];
    $('resultList').innerHTML = m.players.map((p,i) =>
      `<li style="background:${p.color}">${medals[i]||'  '} ${p.name} <span>${p.score} pts</span></li>`
    ).join('');
  }
};

function show(id) { document.querySelectorAll('.screen').forEach(s => s.classList.remove('active')); $(id).classList.add('active'); }
function pickContinent(c) { selectedContinent = c; document.querySelectorAll('.cont-btn').forEach(b => b.classList.toggle('selected', b.textContent.startsWith(c))); $('startBtn').disabled = false; }

$('startBtn').onclick = () => {
  ws.send(JSON.stringify({ type:'start', continent: selectedContinent, showFlags: $('showFlags').checked }));
};
$('nextBtn').onclick = () => ws.send(JSON.stringify({type:'next'}));
</script>
</body></html>
