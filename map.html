<!DOCTYPE html>
<html><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>🗺️ Guess the Country — Map Edition</title>
<script src="https://d3js.org/d3.v7.min.js"></script>
<script src="https://d3js.org/topojson.v3.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui;background:#1a1a2e url('/gamebackground.png') center/cover fixed;color:#eee;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:20px}
h1{font-size:1.8em;margin-bottom:10px}
.screen{display:none;width:100%;max-width:800px;text-align:center}
.screen.active{display:block}
#mapSvg{background:#0f1629;border-radius:12px;margin:10px auto;display:block}
.continent-bg{fill:#1e293b;stroke:#334155;stroke-width:.3}
.highlight{fill:#f59e0b;stroke:#1a1a2e;stroke-width:.5}
.silhouette{fill:#3b82f6;stroke:#1a1a2e;stroke-width:.5}
.options{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:500px;margin:15px auto}
.opt{padding:14px;border:2px solid #333;border-radius:10px;background:#16213e;color:#eee;font-size:1.1em;cursor:pointer;transition:.15s}
.opt:hover{border-color:#3b82f6}
.opt.correct{border-color:#22c55e;background:#16332e}
.opt.wrong{border-color:#ef4444;background:#331616}
.opt:disabled{cursor:default;opacity:.7}
.score-bar{font-size:1.2em;margin:10px 0;color:#f59e0b}
.phase-label{font-size:.9em;color:#888;margin:5px 0}
.next-btn{padding:10px 30px;border:none;border-radius:8px;background:#3b82f6;color:#fff;font-size:1.1em;cursor:pointer;margin-top:10px}
.result{font-size:1.3em;margin:10px 0;padding:12px;border-radius:10px}
.result.correct{background:#16332e;color:#22c55e}
.result.wrong{background:#331616;color:#ef4444}
.cont-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:500px;margin:15px auto}
.cont-btn{padding:15px;border:2px solid #333;border-radius:10px;background:#16213e;color:#eee;font-size:1.1em;cursor:pointer}
.cont-btn:hover{border-color:#3b82f6}
.cont-btn.selected{border-color:#3b82f6;background:#1a3a5c}
.mode-toggle{display:flex;gap:8px;justify-content:center;margin:10px 0;flex-wrap:wrap}
.mode-btn{padding:8px 16px;border:2px solid #333;border-radius:10px;background:#16213e;color:#eee;cursor:pointer;font-size:1em}
.mode-btn.active{border-color:#3b82f6;background:#1a3a5c}
.final-list{list-style:none;max-width:400px;margin:15px auto}
.final-list li{padding:10px;margin:5px 0;border-radius:8px;background:#16213e;display:flex;justify-content:space-between;font-size:1.1em}
</style>
</head><body>
<h1>🗺️ Guess the Country!</h1>
<a href="/" style="color:#3b82f6;text-decoration:none;font-size:.9em">← Back to main</a>

<div id="menu" class="screen active">
  <p style="color:#888;margin:10px 0">Map Edition</p>
  <h3>Pick a continent:</h3>
  <div class="cont-grid" id="contGrid"></div>
  <h3 style="margin-top:15px">Mode:</h3>
  <div class="mode-toggle">
    <button class="mode-btn active" onclick="setMode('silhouette')">🔲 Silhouette</button>
    <button class="mode-btn" onclick="setMode('continent')">🗺️ On continent</button>
    <button class="mode-btn" onclick="setMode('progressive')">🔄 Progressive</button>
  </div>
  <button class="next-btn" id="startBtn" style="margin-top:20px;opacity:.4;cursor:default" onclick="startGame()">Start Game</button>
</div>

<div id="game" class="screen">
  <div class="score-bar" id="scoreBar"></div>
  <div class="phase-label" id="phaseLabel"></div>
  <svg id="mapSvg" width="550" height="380"></svg>
  <div id="options" class="options"></div>
  <div id="feedback"></div>
  <button class="next-btn" id="nextBtn" style="display:none" onclick="nextRound()">Next →</button>
</div>

<div id="results" class="screen">
  <h2>🏆 Results</h2>
  <ul id="resultList" class="final-list"></ul>
  <button class="next-btn" onclick="location.reload()">Play Again</button>
</div>

<script>
// TopoJSON name → display name mapping
const DISPLAY_NAMES = {
  "United States of America":"United States","Dominican Rep.":"Dominican Republic",
  "Czechia":"Czech Republic","Bosnia and Herz.":"Bosnia","Macedonia":"North Macedonia",
  "Dem. Rep. Congo":"DR Congo","Central African Rep.":"Central African Republic",
  "S. Sudan":"South Sudan","Eq. Guinea":"Equatorial Guinea","Solomon Is.":"Solomon Islands",
  "Falkland Is.":"Falkland Islands","Côte d'Ivoire":"Ivory Coast","eSwatini":"Eswatini",
  "W. Sahara":"Western Sahara","Fr. S. Antarctic Lands":"French Southern Lands",
  "N. Cyprus":"Northern Cyprus"
};
function displayName(topoName) { return DISPLAY_NAMES[topoName] || topoName; }

// Continent definitions using TopoJSON names
const CONTINENTS = {
  "Europe": ["Albania","Austria","Belarus","Belgium","Bosnia and Herz.","Bulgaria","Croatia","Czechia","Denmark","Estonia","Finland","France","Germany","Greece","Hungary","Iceland","Ireland","Italy","Kosovo","Latvia","Lithuania","Luxembourg","Macedonia","Moldova","Montenegro","Netherlands","Norway","Poland","Portugal","Romania","Russia","Serbia","Slovakia","Slovenia","Spain","Sweden","Switzerland","Ukraine","United Kingdom"],
  "Asia": ["Afghanistan","Armenia","Azerbaijan","Bangladesh","Bhutan","Brunei","Cambodia","China","Cyprus","Georgia","India","Indonesia","Iran","Iraq","Israel","Japan","Jordan","Kazakhstan","Kuwait","Kyrgyzstan","Laos","Lebanon","Malaysia","Mongolia","Myanmar","Nepal","North Korea","Oman","Pakistan","Philippines","Qatar","Saudi Arabia","South Korea","Sri Lanka","Syria","Taiwan","Tajikistan","Thailand","Timor-Leste","Turkey","Turkmenistan","United Arab Emirates","Uzbekistan","Vietnam","Yemen"],
  "North America": ["Bahamas","Belize","Canada","Costa Rica","Cuba","Dominican Rep.","El Salvador","Guatemala","Haiti","Honduras","Jamaica","Mexico","Nicaragua","Panama","Puerto Rico","Trinidad and Tobago","United States of America"],
  "South America": ["Argentina","Bolivia","Brazil","Chile","Colombia","Ecuador","Guyana","Paraguay","Peru","Suriname","Uruguay","Venezuela"]
};

let allFeatures, gameMode='silhouette', selectedContinent=null;
let countries=[], round=0, score=0, currentCountry=null, phase=1;
const svg = d3.select("#mapSvg");
const W=550, H=380;
const $=id=>document.getElementById(id);

// Build continent buttons
function buildMenu() {
  $('contGrid').innerHTML = Object.entries(CONTINENTS).map(([name,arr]) =>
    `<button class="cont-btn" onclick="pickCont('${name}')">${name} (${arr.length})</button>`
  ).join('');
}
buildMenu();

d3.json("/countries-110m.json").then(data => {
  allFeatures = topojson.feature(data, data.objects.countries).features;
});

function pickCont(c) {
  selectedContinent = c;
  document.querySelectorAll('.cont-btn').forEach(b => b.classList.toggle('selected', b.textContent.startsWith(c)));
  $('startBtn').style.opacity='1'; $('startBtn').style.cursor='pointer';
}
function setMode(m) {
  gameMode = m;
  document.querySelectorAll('.mode-btn').forEach(b => b.classList.toggle('active',
    (m==='silhouette'&&b.textContent.includes('Silhouette'))||(m==='continent'&&b.textContent.includes('continent'))||(m==='progressive'&&b.textContent.includes('Progressive'))
  ));
}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

function startGame() {
  if (!selectedContinent) return;
  const pool = CONTINENTS[selectedContinent];
  // Pick up to 15 countries that exist in TopoJSON
  const available = pool.filter(n => allFeatures.find(f => f.properties.name === n));
  countries = shuffle([...available]).slice(0, Math.min(15, available.length));
  round = 0; score = 0; phase = 1;
  show('game');
  showRound();
}

function showRound() {
  if (round >= countries.length) { endGame(); return; }
  currentCountry = countries[round];
  phase = 1;
  $('scoreBar').textContent = `Round ${round+1}/${countries.length} — Score: ${score}`;
  $('feedback').innerHTML = '';
  $('nextBtn').style.display = 'none';

  // 4 options from same continent
  const pool = CONTINENTS[selectedContinent].filter(c => c !== currentCountry);
  const others = shuffle(pool).slice(0, 3);
  const opts = shuffle([currentCountry, ...others]);
  $('options').innerHTML = opts.map(o => {
    const dn = displayName(o);
    return `<button class="opt" data-topo="${o.replace(/"/g,'&quot;')}" onclick="guess(this)">${dn}</button>`;
  }).join('');

  if (gameMode === 'silhouette' || gameMode === 'progressive') {
    $('phaseLabel').textContent = gameMode === 'progressive' ? 'Phase 1: Silhouette — 2 pts' : 'What country is this?';
    drawSilhouette(currentCountry);
  } else {
    $('phaseLabel').textContent = 'Find the highlighted country:';
    drawContinent(currentCountry);
  }
}

function drawSilhouette(name) {
  svg.selectAll("*").remove();
  const feat = allFeatures.find(f => f.properties.name === name);
  if (!feat) return;
  const proj = d3.geoMercator().fitSize([W-20, H-20], feat);
  const path = d3.geoPath().projection(proj);
  svg.append("path").datum(feat).attr("d", path).attr("class","silhouette");
}

function drawContinent(name) {
  svg.selectAll("*").remove();
  const members = CONTINENTS[selectedContinent];
  const contFeats = allFeatures.filter(f => members.includes(f.properties.name));
  const target = allFeatures.find(f => f.properties.name === name);
  if (!contFeats.length || !target) return;

  const collection = {type:"FeatureCollection", features:contFeats};
  const proj = d3.geoMercator().fitSize([W-20, H-20], collection);
  const path = d3.geoPath().projection(proj);

  svg.selectAll(".bg").data(contFeats).enter().append("path").attr("d",path).attr("class","continent-bg");
  svg.append("path").datum(target).attr("d",path).attr("class","highlight");
}

function guess(btn) {
  const picked = btn.dataset.topo;
  document.querySelectorAll('.opt').forEach(b => b.disabled = true);
  const correct = picked === currentCountry;
  const dn = displayName(currentCountry);

  if (correct) {
    btn.classList.add('correct');
    const pts = (gameMode==='progressive' && phase===1) ? 2 : 1;
    score += pts;
    $('feedback').innerHTML = `<div class="result correct">✅ Correct! +${pts} — ${dn}</div>`;
    $('scoreBar').textContent = `Round ${round+1}/${countries.length} — Score: ${score}`;
    $('nextBtn').style.display = 'inline-block';
  } else {
    btn.classList.add('wrong');
    document.querySelectorAll('.opt').forEach(b => { if(b.dataset.topo===currentCountry) b.classList.add('correct'); });

    if (gameMode==='progressive' && phase===1) {
      phase = 2;
      $('feedback').innerHTML = `<div class="result wrong">❌ Wrong! Here's a hint — find it on the map (1 pt)</div>`;
      document.querySelectorAll('.opt').forEach(b => { b.disabled=false; b.className='opt'; });
      $('phaseLabel').textContent = 'Phase 2: On the continent — 1 pt';
      drawContinent(currentCountry);
      return;
    }
    $('feedback').innerHTML = `<div class="result wrong">❌ It was ${dn}</div>`;
    // Show it on the continent so they learn
    if (gameMode==='silhouette') drawContinent(currentCountry);
    $('nextBtn').style.display = 'inline-block';
  }
}

function nextRound() { round++; showRound(); }

function endGame() {
  show('results');
  const max = gameMode==='progressive' ? countries.length*2 : countries.length;
  $('resultList').innerHTML = `
    <li>🎯 Score: ${score} / ${max} (${Math.round(score/max*100)}%)</li>
    <li>📍 Continent: ${selectedContinent}</li>
    <li>🗺️ Mode: ${gameMode}</li>
  `;
}

function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));$(id).classList.add('active')}
</script>
</body></html>
