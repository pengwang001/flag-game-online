<!DOCTYPE html>
<html><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>🌍 Trivia Lobby — Play</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui;background:#0a0e1a url('/gamebackground.png') center/cover fixed;color:#eee;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px}
h1{font-size:1.4em;margin-bottom:12px;letter-spacing:3px;color:#8899bb;font-weight:400}
h1 strong{display:block;font-size:1.8em;font-weight:900;letter-spacing:1px;background:linear-gradient(180deg,#e8edf5 0%,#7ba4d4 40%,#4a7ab5 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 2px 8px rgba(80,140,220,.3))}
.screen{display:none;width:100%;max-width:400px;text-align:center}
.screen.active{display:block}
.screen.active#play{display:flex;flex-direction:column;height:calc(100vh - 40px);height:calc(100dvh - 40px)}
input{width:100%;padding:14px;border:1px solid #2a3550;border-radius:12px;background:rgba(16,22,40,.7);color:#eee;font-size:1.2em;text-align:center;margin:10px 0}
.join-btn{width:100%;padding:14px;border:none;border-radius:12px;background:linear-gradient(135deg,#5b9ef6,#3b7ee6);color:#fff;font-size:1.2em;cursor:pointer;font-weight:600;letter-spacing:1px;box-shadow:0 4px 15px rgba(59,130,246,.3)}
.lang-toggle{display:flex;gap:8px;justify-content:center;margin:12px 0}
.lang-btn{padding:10px 20px;border:1px solid #2a3550;border-radius:20px;background:rgba(16,22,40,.6);color:#8899bb;font-size:1em;cursor:pointer;transition:.2s}
.lang-btn.active{border-color:#5b9ef6;background:rgba(91,158,246,.15);color:#5b9ef6}
.flag{font-size:4em;margin:10px 0}
.clues{text-align:left;margin:10px 0}
.clue{padding:8px 12px;margin:4px 0;background:rgba(16,22,40,.7);border:1px solid #1e2a45;border-radius:10px;font-size:.95em;animation:fadeIn .4s}
@keyframes fadeIn{from{opacity:0;transform:translateY(-5px)}to{opacity:1;transform:none}}
.options{display:grid;gap:10px;margin:0;flex-shrink:0}
.opt{padding:16px;border:1px solid #2a3550;border-radius:12px;background:rgba(16,22,40,.7);color:#eee;font-size:1.1em;cursor:pointer;transition:.2s;-webkit-tap-highlight-color:transparent}
.opt:active{transform:scale(.97)}
.opt.correct{border-color:#22c55e;background:rgba(22,51,46,.8);box-shadow:0 0 12px rgba(34,197,94,.2)}
.opt.wrong{border-color:#ef4444;background:rgba(51,22,22,.8)}
.opt.selected{border-color:#f59e0b;background:rgba(51,46,22,.8)}
.opt:disabled{cursor:default;opacity:.7}
.points{color:#f59e0b;font-size:1.3em;font-weight:bold;margin:5px 0}
.result{font-size:1.5em;margin:15px 0;padding:15px;border-radius:12px}
.result.correct{background:#16332e;color:#22c55e}
.result.wrong{background:#331616;color:#ef4444}
.waiting{color:#667799;font-size:1em;margin:15px 0}
.status{font-size:.85em;color:#556;margin:5px 0}
.final-list{list-style:none;margin:15px 0}
.final-list li{padding:10px;margin:5px 0;border-radius:8px;display:flex;justify-content:space-between;font-size:1.1em}
.landmark{max-width:250px;max-height:150px;border-radius:10px;margin:8px auto;display:block}
.timer-wrap{max-width:350px;margin:8px auto;display:none}
.timer-bar-bg{height:8px;background:#333;border-radius:4px;overflow:hidden}
.timer-bar-fill{height:100%;background:#3b82f6;border-radius:4px;transition:width .15s linear}
.timer-bar-fill.warning{background:#f59e0b}
.timer-bar-fill.danger{background:#ef4444}
.timer-text{font-size:1em;font-weight:bold;margin-top:2px}
</style>
</head><body>
<script src="https://d3js.org/d3.v7.min.js"></script>
<script src="https://d3js.org/topojson.v3.min.js"></script>
<h1 id="title">✦ TRIVIA LOBBY ✦<strong>PLAY</strong></h1>

<div id="join" class="screen active">
  <div class="lang-toggle">
    <button class="lang-btn active" onclick="setLang('en')">English</button>
    <button class="lang-btn" onclick="setLang('zh')">中文</button>
  </div>
  <input id="nameInput" placeholder="Your name" maxlength="15" autofocus>
  <button class="join-btn" id="joinBtn">Join Game</button>
  <p id="joinError" style="color:#ef4444;margin-top:10px"></p>
</div>

<div id="wait" class="screen">
  <p class="waiting" id="waitMsg">✅ You're in! Waiting for host to start...</p>
</div>

<div id="play" class="screen">
  <div id="playScroll" style="flex:1;overflow-y:auto;min-height:0">
  <div class="status" id="roundInfo"></div>
  <div class="timer-wrap" id="timerWrap"><div class="timer-bar-bg"><div class="timer-bar-fill" id="timerBar" style="width:100%"></div></div><div class="timer-text" id="timerText"></div></div>
  <div class="points" id="pointsHint"></div>
  <div class="flag" id="flag"></div>
  <img id="landmark" class="landmark" style="display:none">
  <svg id="mapSvg" width="380" height="260" style="display:none;background:#0f1629;border-radius:10px;margin:8px auto"></svg>
  <div id="clueList" class="clues"></div>
  </div>
  <div id="options" class="options"></div>
  <div id="feedback"></div>
</div>

<div id="gameover" class="screen">
  <h2 id="gameoverTitle">🏆 Game Over!</h2>
  <ol id="finalList" class="final-list"></ol>
  <h3 style="margin-top:15px;color:#f59e0b">👑 Leaderboard</h3>
  <ol id="leaderList" class="final-list" style="font-size:.9em"></ol>
</div>

<script>
let lang = 'en';

"Japan":"日本","India":"印度","China":"中国","South Korea":"韩国","Thailand":"泰国","Vietnam":"越南","Turkey":"土耳其","Singapore":"新加坡","Philippines":"菲律宾","Indonesia":"印度尼西亚","Malaysia":"马来西亚","Israel":"以色列","Nepal":"尼泊尔","Bangladesh":"孟加拉国","Mongolia":"蒙古","Sri Lanka":"斯里兰卡","Cambodia":"柬埔寨","United Arab Emirates":"阿联酋","Jordan":"约旦","Uzbekistan":"乌兹别克斯坦","Myanmar":"缅甸","Kazakhstan":"哈萨克斯坦","Lebanon":"黎巴嫩",

"Brazil":"巴西","Argentina":"阿根廷","Colombia":"哥伦比亚","Peru":"秘鲁","Chile":"智利","Ecuador":"厄瓜多尔","Uruguay":"乌拉圭","Venezuela":"委内瑞拉","Bolivia":"玻利维亚","Paraguay":"巴拉圭","Guyana":"圭亚那","Suriname":"苏里南",

const ZH_CAPITALS={"Abuja":"阿布贾","Cairo":"开罗","Pretoria":"比勒陀利亚","Nairobi":"内罗毕","Addis Ababa":"亚的斯亚贝巴","Rabat":"拉巴特","Accra":"阿克拉","Dodoma":"多多马","Kigali":"基加利","Dakar":"达喀尔","Tunis":"突尼斯","Kampala":"坎帕拉","Yamoussoukro":"亚穆苏克罗","Antananarivo":"塔那那利佛","Harare":"哈拉雷","Tokyo":"东京","New Delhi":"新德里","Beijing":"北京","Seoul":"首尔","Bangkok":"曼谷","Hanoi":"河内","Ankara":"安卡拉","Singapore":"新加坡","Manila":"马尼拉","Jakarta":"雅加达","Kuala Lumpur":"吉隆坡","Jerusalem":"耶路撒冷","Kathmandu":"加德满都","Dhaka":"达卡","Ulaanbaatar":"乌兰巴托","Colombo":"科伦坡","Phnom Penh":"金边","Abu Dhabi":"阿布扎比","Amman":"安曼","Tashkent":"塔什干","Naypyidaw":"内比都","Astana":"阿斯塔纳","Beirut":"贝鲁特","Paris":"巴黎","Berlin":"柏林","Rome":"罗马","Madrid":"马德里","London":"伦敦","Amsterdam":"阿姆斯特丹","Stockholm":"斯德哥尔摩","Athens":"雅典","Lisbon":"里斯本","Warsaw":"华沙","Oslo":"奥斯陆","Bern":"伯尔尼","Dublin":"都柏林","Vienna":"维也纳","Zagreb":"萨格勒布","Helsinki":"赫尔辛基","Copenhagen":"哥本哈根","Prague":"布拉格","Budapest":"布达佩斯","Bucharest":"布加勒斯特","Brussels":"布鲁塞尔","Reykjavik":"雷克雅未克","Washington, D.C.":"华盛顿","Ottawa":"渥太华","Mexico City":"墨西哥城","Havana":"哈瓦那","Kingston":"金斯敦","San José":"圣何塞","Panama City":"巴拿马城","Port-au-Prince":"太子港","Santo Domingo":"圣多明各","Guatemala City":"危地马拉城","Port of Spain":"西班牙港","Nassau":"拿骚","Brasília":"巴西利亚","Buenos Aires":"布宜诺斯艾利斯","Bogotá":"波哥大","Lima":"利马","Santiago":"圣地亚哥","Quito":"基多","Montevideo":"蒙得维的亚","Caracas":"加拉加斯","Sucre":"苏克雷","Asunción":"亚松森","Georgetown":"乔治敦","Paramaribo":"帕拉马里博","Canberra":"堪培拉","Wellington":"惠灵顿","Suva":"苏瓦","Port Moresby":"莫尔兹比港","Apia":"阿皮亚","Nukuʻalofa":"努库阿洛法","Port Vila":"维拉港","Honiara":"霍尼亚拉"};

const UI = {
  en: { title:"✦ TRIVIA LOBBY ✦", placeholder:"Your name", join:"Join Game", wait:"✅ You're in! Waiting for host to start...", round:"Round", pts:"pts", correct:"✅ Correct!", wrong:"❌ It was", gameover:"🏆 Game Over!", enterName:"Enter a name!" },
  zh: { title:"✦ 知识竞赛 ✦", placeholder:"你的名字", join:"加入游戏", wait:"✅ 已加入！等待主持人开始...", round:"第", pts:"分", correct:"✅ 答对了！", wrong:"❌ 正确答案是", gameover:"🏆 游戏结束！", enterName:"请输入名字！" }
};

function t(key) { return UI[lang][key]; }
function cn(name) { return lang === 'zh' ? (ZH[name] || name) : name; }
function zhAny(name) { return lang==='zh' ? (ZH[name]||ZH_CAPITALS[name]||ZH_STATES[name]||name) : name; }

function setLang(l) {
  lang = l;
  document.querySelectorAll('.lang-btn').forEach(b => b.classList.toggle('active', b.textContent === (l==='en'?'English':'中文')));
  $('title').innerHTML = t('title') + '<strong>PLAY</strong>';
  $('nameInput').placeholder = t('placeholder');
  $('joinBtn').textContent = t('join');
  $('waitMsg').textContent = t('wait');
  $('gameoverTitle').textContent = t('gameover');
}

const proto = location.protocol === 'https:' ? 'wss' : 'ws';
let ws;
const $ = id => document.getElementById(id);

const audioCtx = new (window.AudioContext||window.webkitAudioContext)();
function playTone(freq,dur,type='sine',vol=0.3){
  const o=audioCtx.createOscillator(),g=audioCtx.createGain();
  o.type=type;o.frequency.value=freq;g.gain.value=vol;
  o.connect(g);g.connect(audioCtx.destination);
  o.start();g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+dur);
  o.stop(audioCtx.currentTime+dur);
}
function sfxCorrect(){playTone(523,.1);setTimeout(()=>playTone(659,.1),100);setTimeout(()=>playTone(784,.2),200)}
function sfxWrong(){playTone(200,.15,'square',0.2);setTimeout(()=>playTone(150,.3,'square',0.2),150)}
function sfxNewRound(){playTone(440,.08,'sine',0.15)}
function sfxClue(){playTone(800,.05,'sine',0.15)}

let allMapFeatures = null;
fetch('/countries-110m.json').then(r=>r.json()).then(data=>{
  allMapFeatures = topojson.feature(data, data.objects.countries).features;
}).catch(()=>{});
const MC={"Europe":["Albania","Austria","Belarus","Belgium","Bosnia and Herz.","Bulgaria","Croatia","Czechia","Denmark","Estonia","Finland","France","Germany","Greece","Hungary","Iceland","Ireland","Italy","Kosovo","Latvia","Lithuania","Luxembourg","Macedonia","Moldova","Montenegro","Netherlands","Norway","Poland","Portugal","Romania","Russia","Serbia","Slovakia","Slovenia","Spain","Sweden","Switzerland","Ukraine","United Kingdom"],"Asia":["Afghanistan","Armenia","Azerbaijan","Bangladesh","Bhutan","Brunei","Cambodia","China","Cyprus","Georgia","India","Indonesia","Iran","Iraq","Israel","Japan","Jordan","Kazakhstan","Kuwait","Kyrgyzstan","Laos","Lebanon","Malaysia","Mongolia","Myanmar","Nepal","North Korea","Oman","Pakistan","Philippines","Qatar","Saudi Arabia","South Korea","Sri Lanka","Syria","Taiwan","Tajikistan","Thailand","Timor-Leste","Turkey","Turkmenistan","United Arab Emirates","Uzbekistan","Vietnam","Yemen"],"North America":["Bahamas","Belize","Canada","Costa Rica","Cuba","Dominican Rep.","El Salvador","Guatemala","Haiti","Honduras","Jamaica","Mexico","Nicaragua","Panama","Puerto Rico","Trinidad and Tobago","United States of America"],"South America":["Argentina","Bolivia","Brazil","Chile","Colombia","Ecuador","Guyana","Paraguay","Peru","Suriname","Uruguay","Venezuela"]};
const MAP_DN={"United States of America":"United States","Dominican Rep.":"Dominican Republic","Czechia":"Czech Republic","Bosnia and Herz.":"Bosnia","Macedonia":"North Macedonia"};
function drawMapOnPlayer(topoName,cont){const svg=d3.select('#mapSvg');svg.selectAll('*').remove();if(!allMapFeatures)return;const members=MC[cont]||[];const cf=allMapFeatures.filter(f=>members.includes(f.properties.name));const t=allMapFeatures.find(f=>f.properties.name===topoName);if(!cf.length||!t)return;const proj=d3.geoMercator().fitSize([360,240],{type:'FeatureCollection',features:cf});const p=d3.geoPath().projection(proj);svg.selectAll('.bg').data(cf).enter().append('path').attr('d',p).attr('fill','#1e293b').attr('stroke','#334155').attr('stroke-width',.3);svg.append('path').datum(t).attr('d',p).attr('fill','#f59e0b').attr('stroke','#1a1a2e').attr('stroke-width',.5)}
let usStateFeatures=null;
fetch('/states-10m.json').then(r=>r.json()).then(data=>{usStateFeatures=topojson.feature(data,data.objects.states).features}).catch(()=>{});
function drawUsMapOnPlayer(stateName){const svg=d3.select('#mapSvg');svg.selectAll('*').remove();if(!usStateFeatures)return;const lower48=usStateFeatures.filter(f=>!['Alaska','Hawaii','Puerto Rico','American Samoa','Guam','Commonwealth of the Northern Mariana Islands','United States Virgin Islands','District of Columbia'].includes(f.properties.name));const t=usStateFeatures.find(f=>f.properties.name===stateName);if(!t)return;const isAH=stateName==='Alaska'||stateName==='Hawaii';const bg=isAH?[t]:lower48;const proj=isAH?d3.geoMercator().fitSize([360,240],{type:'FeatureCollection',features:[t]}):d3.geoAlbersUsa().fitSize([360,240],{type:'FeatureCollection',features:lower48});const p=d3.geoPath().projection(proj);svg.selectAll('.bg').data(bg).enter().append('path').attr('d',p).attr('fill','#1e293b').attr('stroke','#334155').attr('stroke-width',.3);if(!isAH)svg.append('path').datum(t).attr('d',p).attr('fill','#f59e0b').attr('stroke','#1a1a2e').attr('stroke-width',.5);else svg.select('path').attr('fill','#f59e0b')}
let caFeatures=null;
fetch('/canada.json').then(r=>r.json()).then(data=>{caFeatures=data.features}).catch(()=>{});
function drawCaMapOnPlayer(provName){const svg=d3.select('#mapSvg');svg.selectAll('*').remove();if(!caFeatures)return;const t=caFeatures.find(f=>f.properties.name===provName);if(!t)return;const proj=d3.geoMercator().fitSize([360,240],{type:'FeatureCollection',features:caFeatures});const p=d3.geoPath().projection(proj);svg.selectAll('.bg').data(caFeatures).enter().append('path').attr('d',p).attr('fill','#1e293b').attr('stroke','#334155').attr('stroke-width',.3);svg.append('path').datum(t).attr('d',p).attr('fill','#f59e0b').attr('stroke','#1a1a2e').attr('stroke-width',.5)}
function renderLocalClue(c){if(typeof c==='string')return`<div class="clue">💡 ${c}</div>`;return`<div class="clue">📸 ${c.caption}<img src="${c.img}" style="max-width:100%;max-height:150px;border-radius:8px;margin-top:6px"></div>`}

function connect() {
  ws = new WebSocket(`${proto}://${location.host}`);
  ws.onmessage = e => handle(JSON.parse(e.data));
  ws.onclose = () => setTimeout(connect, 2000);
}
connect();

$('joinBtn').onclick = () => {
  const name = $('nameInput').value.trim();
  if (!name) { $('joinError').textContent = t('enterName'); return; }
  ws.send(JSON.stringify({ type: 'join', name }));
};
$('nameInput').onkeydown = e => { if (e.key === 'Enter') $('joinBtn').click(); };

function show(id) { document.querySelectorAll('.screen').forEach(s => s.classList.remove('active')); $(id).classList.add('active'); }

function handle(m) {
  if (m.type === 'joined') { if (m.rejoined) show('play'); else show('wait'); }
  if (m.type === 'error') $('joinError').textContent = m.msg;
  if (m.type === 'lobby') show('wait');

  if (m.type === 'question') {
    show('play');
    if(audioCtx.state==='suspended')audioCtx.resume();
    sfxNewRound();
    $('roundInfo').textContent = lang==='zh' ? `${t('round')} ${m.round}/${m.total} 题` : `${t('round')} ${m.round}/${m.total}`;
    if (m.timer) { $('timerWrap').style.display='block'; $('timerBar').style.width='100%'; $('timerBar').className='timer-bar-fill'; $('timerText').textContent=m.timer+'s'; }
    else { $('timerWrap').style.display='none'; }

    // Reset visuals
    $('flag').style.display='none'; $('landmark').style.display='none'; $('mapSvg').style.display='none'; $('clueList').innerHTML='';

    if (m.gameType === 'map') {
      $('mapSvg').style.display='block';
      $('pointsHint').textContent = m.timer ? `⚡ ${m.points} ${t('pts')}` : '⚡ 1 pt';
      drawMapOnPlayer(m.topoName, m.continent);
    } else if (m.gameType === 'local') {
      $('pointsHint').textContent = `⚡ ${m.points} ${t('pts')}`;
      $('clueList').innerHTML = renderLocalClue(m.clues[0]);
    } else if (m.gameType === 'capital') {
      $('flag').style.display='block';
      $('flag').textContent = m.flag;
      $('clueList').innerHTML = `<div class="clue" style="font-size:1.2em">${lang==='zh'?`<b>${cn(m.country)}</b> 的首都是什么？`:`What is the capital of <b>${m.country}</b>?`}</div>`;
      $('pointsHint').textContent = m.timer ? `⚡ ${m.points} ${t('pts')}` : '⚡ 1 pt';
    } else if (m.gameType === 'flagquiz') {
      $('clueList').innerHTML = `<div class="clue" style="font-size:1.2em">${lang==='zh'?`<b>${cn(m.country)}</b> 的国旗是哪个？`:`Which flag belongs to <b>${cn(m.country)}</b>?`}</div>`;
      $('pointsHint').textContent = m.timer ? `⚡ ${m.points} ${t('pts')}` : '⚡ 1 pt';
    } else if (m.gameType === 'usmap') {
      $('mapSvg').style.display='block';
      $('pointsHint').textContent = `⚡ ${m.points} ${t('pts')}`;
      $('clueList').innerHTML = `<div class="clue">💡 ${m.clues[0]}</div>`;
      drawUsMapOnPlayer(m.stateName);
    } else if (m.gameType === 'camap') {
      $('mapSvg').style.display='block';
      $('pointsHint').textContent = m.timer ? `⚡ ${m.points} ${t('pts')}` : '⚡ 1 pt';
      drawCaMapOnPlayer(m.stateName);
    } else {
      $('flag').style.display='block';
      $('flag').textContent = m.flag;
      if (m.img) { $('landmark').src = m.img; $('landmark').style.display = 'block'; }
      $('clueList').innerHTML = `<div class="clue">💡 ${lang==='zh' && m.zhClues?.[0] ? m.zhClues[0] : m.clues[0]}</div>`;
      $('pointsHint').textContent = `⚡ ${m.points} ${t('pts')}`;
    }

    $('feedback').innerHTML = '';
    const zhName = o => lang==='zh' ? (ZH_CAPITALS[o]||ZH_STATES[o]||ZH[o]||o) : o;
    const optDisplay = o => m.gameType==='map' ? cn(MAP_DN[o]||o) : m.gameType==='flagquiz' ? `<span style="font-size:2.5em">${o}</span>` : m.gameType==='usmap' || m.gameType==='camap' ? zhName(o) : m.gameType==='capital' ? zhName(o) : (m.gameType==='local' ? o : cn(o));
    $('options').style.gridTemplateColumns = m.gameType==='flagquiz' ? 'repeat(2,1fr)' : '';
    $('options').innerHTML = m.options.map(o =>
      `<button class="opt" data-en="${o}" onclick="answer(this,'${o.replace(/'/g,"\\'")}')">${optDisplay(o)}</button>`
    ).join('');
  }

  if (m.type === 'clue') {
    sfxClue();
    if (m.clue && typeof m.clue === 'object') {
      $('clueList').innerHTML += renderLocalClue(m.clue);
    } else {
      $('clueList').innerHTML += `<div class="clue">💡 ${lang==='zh' && m.zhClue ? m.zhClue : m.clue}</div>`;
    }
    if (m.points) $('pointsHint').textContent = `⚡ ${m.points} ${t('pts')}`;
    $('playScroll').scrollTop=$('playScroll').scrollHeight;
  }

  if (m.type === 'timer_tick') {
    const pct = (m.left / m.total) * 100;
    $('timerBar').style.width = pct + '%';
    $('timerBar').className = 'timer-bar-fill' + (pct<=20?' danger':pct<=40?' warning':'');
    $('timerText').textContent = Math.ceil(m.left) + 's';
  }

  if (m.type === 'timeout') {
    $('timerWrap').style.display='none';
    sfxWrong();
    document.querySelectorAll('.opt').forEach(b => {
      b.disabled = true;
      if (b.dataset.en === m.correctAnswer) b.classList.add('correct');
      else if (!b.classList.contains('selected')) b.classList.add('wrong');
    });
    if (!$('feedback').innerHTML) {
      $('feedback').innerHTML = `<div class="result wrong">${lang==='zh'?'⏰ 时间到！':'⏰ Time\'s up!'} ${zhAny(m.correctAnswer)}</div>`;
    }
  }

  if (m.type === 'answer_result') {
    m.correct ? sfxCorrect() : sfxWrong();
    document.querySelectorAll('.opt').forEach(b => {
      b.disabled = true;
      if (b.dataset.en === m.correctAnswer) b.classList.add('correct');
    });
    $('feedback').innerHTML = m.correct
      ? `<div class="result correct">${t('correct')}</div>`
      : `<div class="result wrong">${t('wrong')} ${zhAny(m.correctAnswer)}</div>`;
  }

  if (m.type === 'all_answered') {
    document.querySelectorAll('.opt').forEach(b => {
      b.disabled = true;
      if (b.dataset.en === m.correctAnswer) b.classList.add('correct');
      else if (!b.classList.contains('selected')) b.classList.add('wrong');
    });
  }

  if (m.type === 'gameover') {
    show('gameover');
    $('gameoverTitle').textContent = t('gameover');
    const medals = ['🥇','🥈','🥉'];
    $('finalList').innerHTML = m.players.map((p,i) =>
      `<li style="background:${p.color}">${medals[i]||'  '} ${p.name} <span>${p.score} ${t('pts')}</span></li>`
    ).join('');
    if (m.leaderboard && m.leaderboard.length) {
      $('leaderList').innerHTML = m.leaderboard.map((e,i) =>
        `<li style="background:${i<3?'rgba(245,158,11,.15)':'rgba(22,33,62,.85)'}"><span>${i+1}. ${e.name}</span><span>${e.score} ${t('pts')}</span></li>`
      ).join('');
    }
  }
}

function answer(btn, enName) {
  document.querySelectorAll('.opt').forEach(b => { b.disabled = true; });
  btn.classList.add('selected');
  ws.send(JSON.stringify({ type: 'answer', answer: enName }));
}
</script>
</body></html>
